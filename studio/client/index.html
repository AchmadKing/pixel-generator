<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Local 2D Pixel Game Asset Studio with Non-Destructive Post-Processing and Version History">
  <title>Pixel Game Asset Studio</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/library.css">
</head>
<body class="studio-body">
  <!-- Top Navigation Header -->
  <header class="studio-header">
    <div class="header-brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="6" height="6" fill="#00f0ff"/>
          <rect x="8" y="8" width="8" height="8" fill="#a855f7"/>
          <rect x="16" y="16" width="6" height="6" fill="#10b981"/>
          <rect x="2" y="16" width="6" height="6" fill="#f59e0b"/>
          <rect x="16" y="2" width="6" height="6" fill="#ec4899"/>
        </svg>
      </div>
      <h1 class="brand-title">Pixel Game Asset Studio</h1>
      <span class="brand-badge" id="providerBadge">Mock [Offline]</span>
    </div>

    <div class="header-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="btnToggleLibrary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        Asset Library
      </button>
      <button type="button" class="btn btn-primary btn-sm" id="btnNewAsset">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Asset
      </button>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <main class="studio-workspace">
    <!-- Left Sidebar: Asset Library & Project Navigation -->
    <aside class="library-panel" id="libraryPanel">
      <div class="panel-header">
        <h2>Project Assets</h2>
        <div class="category-filters" id="categoryFilters">
          <button class="filter-chip active" data-category="all">All</button>
          <button class="filter-chip" data-category="items">Items</button>
          <button class="filter-chip" data-category="characters">Characters</button>
          <button class="filter-chip" data-category="environment">Env</button>
          <button class="filter-chip" data-category="vfx">VFX</button>
          <button class="filter-chip" data-category="ui">UI</button>
        </div>
      </div>
      <div class="asset-grid" id="assetGrid">
        <div class="empty-state">Loading assets...</div>
      </div>
    </aside>

    <!-- Center Workspace: Viewport & Comparison Stage -->
    <section class="viewport-stage">
      <!-- Viewport Tool Bar -->
      <div class="viewport-toolbar">
        <div class="tool-group view-modes">
          <button type="button" class="tool-btn active" id="btnModeSplit" title="Before/After Split Comparison">Split View</button>
          <button type="button" class="tool-btn" id="btnModeProcessed" title="Processed Pixel Art Only">Final Output</button>
          <button type="button" class="tool-btn" id="btnModeRaw" title="Raw AI Image Only">Raw Input</button>
          <button type="button" class="tool-btn" id="btnModeSideBySide" title="Side by Side Comparison">Side-by-Side</button>
        </div>

        <div class="tool-group zoom-controls">
          <button type="button" class="tool-btn icon-btn" id="btnZoomOut" title="Zoom Out (-)">−</button>
          <span class="zoom-indicator" id="zoomLevel">800%</span>
          <button type="button" class="tool-btn icon-btn" id="btnZoomIn" title="Zoom In (+)">+</button>
          <button type="button" class="tool-btn" id="btnZoom100" title="Actual 1:1 Size">1:1</button>
          <button type="button" class="tool-btn" id="btnZoomFit" title="Fit to Screen">Fit</button>
          <button type="button" class="tool-btn icon-btn active" id="btnToggleGrid" title="Toggle Pixel Grid">#</button>
        </div>
      </div>

      <!-- Canvas Viewport Container -->
      <div class="canvas-container" id="canvasContainer">
        <!-- Viewport Render Target -->
        <div class="viewport-wrapper" id="viewportWrapper">
          <canvas id="checkerboardCanvas" class="pixel-canvas bg-checker"></canvas>
          <div class="comparison-layers" id="comparisonLayers">
            <canvas id="rawCanvas" class="pixel-canvas raw-layer"></canvas>
            <div class="split-clip-wrapper" id="splitClipWrapper">
              <canvas id="processedCanvas" class="pixel-canvas processed-layer"></canvas>
            </div>
            <!-- Interactive Divider Handle -->
            <div class="split-handle" id="splitHandle">
              <div class="handle-line"></div>
              <div class="handle-thumb">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l-6-7 6-7zm8 0l6 7-6 7V5z"/>
                </svg>
              </div>
            </div>
          </div>
          <canvas id="gridCanvas" class="pixel-canvas grid-layer"></canvas>
        </div>

        <!-- Coordinates HUD Badge -->
        <div class="viewport-hud" id="viewportHud">
          <span id="hudDimensions">32 × 32 px</span>
          <span class="hud-sep">•</span>
          <span id="hudVersion">v1 Active</span>
          <span class="hud-sep">•</span>
          <span id="hudCoords">X: 0 Y: 0</span>
        </div>
      </div>

      <!-- Live Job Progress Bar HUD -->
      <div class="job-progress-hud" id="jobProgressHud" style="display: none;">
        <div class="progress-info">
          <div class="progress-spinner"></div>
          <div class="progress-text">
            <strong id="jobStageTitle">Submitting Job...</strong>
            <span id="jobStageSubtitle">Preparing prompt and parameters</span>
          </div>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="jobProgressFill"></div>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Generation Workbench & Version History -->
    <aside class="workbench-panel">
      <!-- Tabs Header -->
      <div class="workbench-tabs">
        <button class="tab-btn active" data-tab="tabGenerate">Workbench</button>
        <button class="tab-btn" data-tab="tabVersions" id="tabVersionsBtn">History (<span id="versionCountBadge">0</span>)</button>
      </div>

      <!-- Tab 1: Generation Workbench -->
      <div class="tab-content active" id="tabGenerate">
        <form id="generationForm" class="generation-form">
          <div class="form-group">
            <label for="promptInput">Prompt</label>
            <textarea id="promptInput" rows="3" required placeholder="e.g. fantasy health potion bottle with glowing crimson liquid, gold stopper" maxlength="500"></textarea>
            <div class="token-chips">
              <button type="button" class="token-chip" data-text="crisp edges, flat colors">Crisp Edges</button>
              <button type="button" class="token-chip" data-text="glowing magical aura">Glowing</button>
              <button type="button" class="token-chip" data-text="16-bit RPG sprite">16-bit RPG</button>
            </div>
          </div>

          <div class="form-group">
            <label for="negativePromptInput">Negative Prompt (Optional)</label>
            <textarea id="negativePromptInput" rows="2" placeholder="blurry, 3d, realistic, gradient, dithering" maxlength="300"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group col">
              <label for="categorySelect">Category</label>
              <select id="categorySelect">
                <option value="items" selected>Items</option>
                <option value="characters">Characters</option>
                <option value="environment">Environment</option>
                <option value="vfx">VFX</option>
                <option value="ui">UI</option>
              </select>
            </div>

            <div class="form-group col">
              <label for="resolutionSelect">Resolution</label>
              <select id="resolutionSelect">
                <option value="16">16 × 16 px</option>
                <option value="24">24 × 24 px</option>
                <option value="32" selected>32 × 32 px</option>
                <option value="48">48 × 48 px</option>
                <option value="64">64 × 64 px</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="paletteSelect">Color Palette</label>
            <select id="paletteSelect">
              <option value="endesga-32" selected>Endesga 32 (Fantasy Standard)</option>
              <option value="pico-8">PICO-8 (16 Retro Colors)</option>
              <option value="gameboy-4">GameBoy (4 Green Shades)</option>
              <option value="nes-54">NES 54 (Classic Console)</option>
            </select>
            <div class="palette-preview-swatches" id="palettePreviewSwatches"></div>
          </div>

          <div class="form-group">
            <label for="seedInput">Seed</label>
            <div class="input-with-button">
              <input type="number" id="seedInput" min="0" max="2147483647" placeholder="Random Seed">
              <button type="button" class="btn btn-secondary btn-icon" id="btnRandomSeed" title="Roll Random Seed">🎲</button>
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="skipPostProcessingCheck">
              <span>Bypass Post-Processing (Raw AI Image)</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnGenerate">
              <span class="btn-icon">⚡</span> Generate Asset
            </button>
          </div>
        </form>
      </div>

      <!-- Tab 2: Version History Timeline -->
      <div class="tab-content" id="tabVersions">
        <div class="version-timeline-header">
          <h3 id="currentAssetNameTitle">No Asset Selected</h3>
          <p class="asset-subtitle" id="currentAssetCategoryTitle">Select or create an asset</p>
        </div>
        <div class="version-timeline-list" id="versionTimelineList">
          <div class="empty-state">No version history available.</div>
        </div>
        <div class="asset-danger-zone">
          <button type="button" class="btn btn-danger btn-block btn-sm" id="btnDeleteAsset">
            Delete Asset
          </button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Confirm Modal Dialog -->
  <dialog class="studio-modal" id="confirmModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">Confirm Action</h3>
      <p class="modal-message" id="modalMessage">Are you sure?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="modalConfirm">Confirm Delete</button>
      </div>
    </div>
  </dialog>

  <!-- ES Modules Application Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
