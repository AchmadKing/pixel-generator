<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Local 2D Pixel Game Asset Studio with Non-Destructive Post-Processing and Version History">
  <title>Pixel Game Asset Studio</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/library.css">
</head>
<body class="studio-body">
  <!-- Top Navigation Header -->
  <header class="studio-header">
    <div class="header-brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="6" height="6" fill="#00f0ff"/>
          <rect x="8" y="8" width="8" height="8" fill="#a855f7"/>
          <rect x="16" y="16" width="6" height="6" fill="#10b981"/>
          <rect x="2" y="16" width="6" height="6" fill="#f59e0b"/>
          <rect x="16" y="2" width="6" height="6" fill="#ec4899"/>
        </svg>
      </div>
      <h1 class="brand-title">Pixel Game Asset Studio</h1>
      <span class="brand-badge" id="workflowBadge">AI Agent Mode</span>
    </div>

    <div class="header-actions">
      <button type="button" class="btn btn-secondary btn-sm" id="btnToggleLibrary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        Asset Library
      </button>
      <button type="button" class="btn btn-primary btn-sm" id="btnRescanAssets" title="Rescan assets/generated/ folder">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Rescan Assets
      </button>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <main class="studio-workspace">
    <!-- Left Sidebar: Asset Library & Project Navigation -->
    <aside class="library-panel" id="libraryPanel">
      <div class="panel-header">
        <h2>Project Assets</h2>
        <div class="category-filters" id="categoryFilters">
          <button class="filter-chip active" data-category="all">All</button>
          <button class="filter-chip" data-category="items">Items</button>
          <button class="filter-chip" data-category="characters">Characters</button>
          <button class="filter-chip" data-category="environment">Env</button>
          <button class="filter-chip" data-category="vfx">VFX</button>
          <button class="filter-chip" data-category="ui">UI</button>
        </div>
      </div>
      <div class="asset-grid" id="assetGrid">
        <div class="empty-state">Loading assets...</div>
      </div>
    </aside>

    <!-- Center Workspace: Viewport & Comparison Stage -->
    <section class="viewport-stage">
      <!-- Viewport Tool Bar -->
      <div class="viewport-toolbar">
        <div class="tool-group view-modes">
          <button type="button" class="tool-btn active" id="btnModeSplit" title="Before/After Split Comparison">Split View</button>
          <button type="button" class="tool-btn" id="btnModeProcessed" title="Processed Pixel Art Only">Final Output</button>
          <button type="button" class="tool-btn" id="btnModeRaw" title="Raw AI Image Only">Raw Input</button>
          <button type="button" class="tool-btn" id="btnModeSideBySide" title="Side by Side Comparison">Side-by-Side</button>
        </div>

        <div class="tool-group zoom-controls">
          <button type="button" class="tool-btn icon-btn" id="btnZoomOut" title="Zoom Out (-)">−</button>
          <span class="zoom-indicator" id="zoomLevel">800%</span>
          <button type="button" class="tool-btn icon-btn" id="btnZoomIn" title="Zoom In (+)">+</button>
          <button type="button" class="tool-btn" id="btnZoom100" title="Actual 1:1 Size">1:1</button>
          <button type="button" class="tool-btn" id="btnZoomFit" title="Fit to Screen">Fit</button>
          <button type="button" class="tool-btn icon-btn active" id="btnToggleGrid" title="Toggle Pixel Grid">#</button>
        </div>
      </div>

      <!-- Canvas Viewport Container -->
      <div class="canvas-container" id="canvasContainer">
        <!-- Viewport Render Target -->
        <div class="viewport-wrapper" id="viewportWrapper">
          <canvas id="checkerboardCanvas" class="pixel-canvas bg-checker"></canvas>
          <div class="comparison-layers" id="comparisonLayers">
            <canvas id="rawCanvas" class="pixel-canvas raw-layer"></canvas>
            <div class="split-clip-wrapper" id="splitClipWrapper">
              <canvas id="processedCanvas" class="pixel-canvas processed-layer"></canvas>
            </div>
            <!-- Interactive Divider Handle -->
            <div class="split-handle" id="splitHandle">
              <div class="handle-line"></div>
              <div class="handle-thumb">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l-6-7 6-7zm8 0l6 7-6 7V5z"/>
                </svg>
              </div>
            </div>
          </div>
          <canvas id="gridCanvas" class="pixel-canvas grid-layer"></canvas>
        </div>

        <!-- Coordinates HUD Badge -->
        <div class="viewport-hud" id="viewportHud">
          <span id="hudDimensions">32 × 32 px</span>
          <span class="hud-sep">•</span>
          <span id="hudVersion">v1 Active</span>
          <span class="hud-sep">•</span>
          <span id="hudCoords">X: 0 Y: 0</span>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Asset Details & Version History -->
    <aside class="workbench-panel">
      <!-- Tabs Header -->
      <div class="workbench-tabs">
        <button class="tab-btn active" data-tab="tabDetails">Asset Details</button>
        <button class="tab-btn" data-tab="tabVersions" id="tabVersionsBtn">History (<span id="versionCountBadge">0</span>)</button>
      </div>

      <!-- Tab 1: Asset Details Inspection Panel -->
      <div class="tab-content active" id="tabDetails">
        <!-- Populated dynamically by AssetDetailsPanel -->
      </div>

      <!-- Tab 2: Version History Timeline -->
      <div class="tab-content" id="tabVersions">
        <div class="version-timeline-header">
          <h3 id="currentAssetNameTitle">No Asset Selected</h3>
          <p class="asset-subtitle" id="currentAssetCategoryTitle">Select or create an asset</p>
        </div>
        <div class="version-timeline-list" id="versionTimelineList">
          <div class="empty-state">No version history available.</div>
        </div>
        <div class="asset-danger-zone">
          <button type="button" class="btn btn-danger btn-block btn-sm" id="btnDeleteAsset">
            Delete Asset
          </button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Confirm Modal Dialog -->
  <dialog class="studio-modal" id="confirmModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">Confirm Action</h3>
      <p class="modal-message" id="modalMessage">Are you sure?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modalCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="modalConfirm">Confirm Delete</button>
      </div>
    </div>
  </dialog>

  <!-- ES Modules Application Script -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
